{% extends 'base.html' %}

{% block title %}{% if object %}Actualizar{% else %}Agregar{% endif %} Mecánico{% endblock %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2>{% if object %}Actualizar{% else %}Agregar{% endif %} Mecánico</h2>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group mb-3">
                                <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
                                {{ form.name }}
                            </div>
                            <div class="form-group mb-3">
                                <label for="{{ form.phone.id_for_label }}">{{ form.phone.label }}</label>
                                {{ form.phone }}
                            </div>
                            <div class="form-group mb-3">
                                <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
                                {{ form.email }}
                            </div>
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-primary">{% if object %}Actualizar{% else %}Guardar{% endif %} Mecánico</button>
                                <a href="{% url 'catalogs:mechanic_list' %}" class="btn btn-secondary ml-2">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
